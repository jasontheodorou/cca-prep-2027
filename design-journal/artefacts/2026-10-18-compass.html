<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>COMPASS</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&display=swap" />
<style>
  /* COMPASS: two halves, planning (COM) and doing (PASS), told apart by a
     wider gap and a change of colour. Same look as the exam prep app. */
  :root {
    --ink: #1d1d22;
    --muted: #5f5f69;
    --plan: #463d62;       /* the app's plum */
    --plan-tint: #efedf5;
    --do: #c4482f;         /* the cc mark's coral, darkened to read as text */
    --do-tint: #fbece7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #fff;
    color: var(--ink);
    font: 400 16px/1.45 'Geist', system-ui, sans-serif;
  }
  .compass {
    width: min(1120px, 100%);
    padding: 64px 48px;
  }
  .halves {
    display: grid;
    grid-template-columns: 3fr 4fr;
    gap: 40px;
  }
  .half__label {
    margin: 0 0 16px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .plan .half__label { color: var(--plan); }
  .do .half__label { color: var(--do); }
  .letters {
    display: grid;
    gap: 12px;
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .plan .letters { grid-template-columns: repeat(3, 1fr); }
  .do .letters { grid-template-columns: repeat(4, 1fr); }
  .letters li {
    padding: 24px 20px 26px;
    border-radius: 20px;
  }
  .plan li { background: var(--plan-tint); }
  .do li { background: var(--do-tint); }
  .letter {
    display: block;
    font-size: 72px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.04em;
  }
  .plan .letter { color: var(--plan); }
  .do .letter { color: var(--do); }
  .word {
    display: block;
    margin-top: 18px;
    font-size: 19px;
    font-weight: 700;
  }
  .line {
    display: block;
    margin-top: 4px;
    color: var(--muted);
    font-size: 15px;
  }
  @media (max-width: 760px) {
    .compass { padding: 32px 16px; }
    .halves { grid-template-columns: 1fr; gap: 32px; }
    .letters { grid-template-columns: 1fr !important; gap: 8px; }
    .letters li { display: grid; grid-template-columns: 56px 1fr; align-items: center; padding: 14px 18px; }
    .letter { grid-row: span 2; font-size: 44px; }
    .word { margin-top: 0; }
  }
</style>
</head>
<body>
  <main class="compass" aria-label="COMPASS: a study system in seven steps">
    <div class="halves">
      <section class="plan" aria-labelledby="plan">
        <p class="half__label" id="plan">Planning</p>
        <ol class="letters">
          <li><span class="letter">C</span><span class="word">Cut</span><span class="line">into pieces</span></li>
          <li><span class="letter">O</span><span class="word">Optimise</span><span class="line">for what really matters</span></li>
          <li><span class="letter">M</span><span class="word">Map</span><span class="line">how you will learn</span></li>
        </ol>
      </section>
      <section class="do" aria-labelledby="do">
        <p class="half__label" id="do">Doing</p>
        <ol class="letters" start="4">
          <li><span class="letter">P</span><span class="word">Plan</span><span class="line">your time in pomodoros</span></li>
          <li><span class="letter">A</span><span class="word">Anchor</span><span class="line">every new idea to one you know</span></li>
          <li><span class="letter">S</span><span class="word">Squeeze</span><span class="line">what you learnt onto one page</span></li>
          <li><span class="letter">S</span><span class="word">Set</span><span class="line">the stakes so you don’t give up</span></li>
        </ol>
      </section>
    </div>
  </main>
</body>
</html>
