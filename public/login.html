<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Sign in · exam prep</title>
    <style>
      :root { color-scheme: light dark; --bg: #ffffff; --ink: #1d1d22; --line: #6b6b76; --accent: #3d3560; --on: #ffffff; --bad: #8f1d1d; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #16161b; --ink: #e9e7f0; --line: #a9a7b4; --accent: #d9d3f5; --on: #16161b; --bad: #ffb4b4; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--ink); font: 18px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; }
      main { width: 100%; max-width: 360px; }
      h1 { font-size: 28px; line-height: 1.2; margin: 0 0 24px; font-weight: 600; }
      label { display: block; margin-bottom: 8px; font-weight: 600; }
      input { width: 100%; font: inherit; padding: 12px 14px; border: 2px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--ink); }
      button { margin-top: 16px; font: inherit; font-weight: 600; padding: 12px 22px; border: 0; border-radius: 999px; background: var(--accent); color: var(--on); cursor: pointer; }
      input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
      #wrong { margin: 0 0 16px; color: var(--bad); font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>exam prep</h1>
      <form method="post" action="/api/login">
        <p id="wrong" role="alert" hidden>That password is not right. Try again.</p>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus />
        <button type="submit">Sign in</button>
      </form>
    </main>
    <script>
      if (new URLSearchParams(location.search).has('wrong')) document.getElementById('wrong').hidden = false
    </script>
  </body>
</html>
